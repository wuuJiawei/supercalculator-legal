<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超级计算器 · 支持与隐私</title>
<style>
  :root { color-scheme: light dark; --fg:#111; --muted:#666; --bg:#fff; --line:#e5e5ea; --accent:#f08a24; }
  @media (prefers-color-scheme: dark){ :root{ --fg:#f5f5f7; --muted:#a1a1a6; --bg:#000; --line:#2c2c2e; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",Helvetica,Arial,sans-serif}
  main{max-width:720px;margin:0 auto;padding:56px 22px 80px}
  h1{font-size:34px;line-height:1.2;margin:0 0 8px;letter-spacing:-.5px}
  h2{font-size:21px;margin:40px 0 10px}
  p,li{color:var(--fg)}
  .muted{color:var(--muted)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .card{border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:26px 0}
  .pill{display:inline-block;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin-bottom:18px}
  ul{padding-left:22px}
  footer{margin-top:56px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:18px}
</style>
</head>
<body>
<main>
  <span class="pill">超级计算器 · Super Calculator</span>
  <h1>支持与隐私</h1>
  <p class="muted">一个纯本地、无账号、无广告的 iOS 计算器。</p>

  <div class="card">
    <h2 style="margin-top:0">隐私政策</h2>
    <p>我们不收集、不上传你的任何数据。详细说明：</p>
    <p><a href="./privacy.html">阅读隐私政策 →</a></p>
  </div>

  <div class="card">
    <h2 style="margin-top:0">支持</h2>
    <p>常见问题、语音播报、标签栏自定义与数据说明：</p>
    <p><a href="./support.html">查看支持页面 →</a></p>
  </div>

  <footer>
    联系邮箱：<a href="mailto:wujiawei0926@gmail.com">wujiawei0926@gmail.com</a><br>
    © 2026 Javeys Wuu
  </footer>
</main>
</body>
</html>
